[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sift"
version = "0.1.0"
description = "Fixed-memory statistics over streams you cannot hold in RAM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "fj-8" }]
keywords = [
  "cardinality",
  "count-min",
  "hyperloglog",
  "quantiles",
  "reservoir-sampling",
  "sketch",
  "streaming",
  "t-digest",
  "welford",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.scripts]
sift = "sift.cli:main"

[project.urls]
Homepage = "https://github.com/fj-8/sift"
Repository = "https://github.com/fj-8/sift"
Issues = "https://github.com/fj-8/sift/issues"
Changelog = "https://github.com/fj-8/sift/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]

[tool.setuptools.packages.find]
where = ["src"]
