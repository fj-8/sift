name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch supersedes the run before it, so the older one is
# cancelled instead of queueing. A run on main is never cancelled: main is the
# release, and its history is the evidence the READMEs point at.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -t .
        shell: bash
      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Console script
        run: sift --version
      - name: Module form
        run: python -m sift --help
